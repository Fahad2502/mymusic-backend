services:
  - type: web
    name: mymusic-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install --no-cache-dir --force-reinstall -r requirements.txt &&
      pip install --no-cache-dir --force-reinstall yt-dlp &&
      (node --version || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs)) || true
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
